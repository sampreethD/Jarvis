<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS AI Assistant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0a0a0f; color: #eee; font-family: 'Segoe UI', sans-serif; }
        .hero { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); padding: 60px 0; text-align: center; }
        .neon-text { color: #00d4ff; text-shadow: 0 0 10px #00d4ff, 0 0 20px #00d4ff; }
        .chat-container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .message { padding: 12px 18px; border-radius: 18px; margin-bottom: 12px; max-width: 80%; }
        .user-msg { background: #007bff; color: white; margin-left: auto; border-bottom-right-radius: 4px; }
        .jarvis-msg { background: #1e1e2e; color: #00d4ff; border-bottom-left-radius: 4px; }
        .mic-btn { position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; border-radius: 50%; background: #00d4ff; border: none; box-shadow: 0 0 20px #00d4ff; }
        .status-dot { height: 10px; width: 10px; background: #00ff00; border-radius: 50%; display: inline-block; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body>
    <div class="hero">
        <h1 class="neon-text">🤖 JARVIS</h1>
        <p>Your AI Assistant with voice capabilities</p>
        <p><span class="status-dot"></span> Online</p>
    </div>
    
    <div class="chat-container">
        <div id="chat" style="height: 400px; overflow-y: auto; border: 1px solid #333; border-radius: 10px; padding: 15px; margin-bottom: 15px;"></div>
        <div class="input-group">
            <input type="text" id="userInput" class="form-control" placeholder="Type your message..." style="background: #1e1e2e; border-color: #333; color: #fff;">
            <button onclick="sendMessage()" class="btn btn-primary">Send</button>
        </div>
        <p class="text-muted small mt-2">⚠️ Static demo - for full voice features, deploy the Python backend</p>
    </div>

    <button class="mic-btn" onclick="toggleVoice()" title="Voice Input">🎤</button>

    <script>
        const chat = document.getElementById('chat');
        const input = document.getElementById('userInput');
        
        function addMessage(text, isUser) {
            const div = document.createElement('div');
            div.className = 'message ' + (isUser ? 'user-msg' : 'jarvis-msg');
            div.textContent = text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }
        
        function sendMessage() {
            const text = input.value.trim();
            if (!text) return;
            addMessage(text, true);
            input.value = '';
            
            // Demo response - replace with your API endpoint
            setTimeout(() => {
                addMessage("Demo mode: Connect your API backend for live responses!", false);
            }, 1000);
        }
        
        input.addEventListener('keypress', e => { if (e.key === 'Enter') sendMessage(); });
        
        function toggleVoice() {
            if ('webkitSpeechRecognition' in window) {
                const rec = new webkitSpeechRecognition();
                rec.onresult = e => { input.value = e.results[0][0].transcript; sendMessage(); };
                rec.start();
            } else {
                alert('Voice input not supported. Use Chrome.');
            }
        }
    </script>
</body>
</html>
