[project]
name = "jarvis"
version = "0.1.0"
description = "JARVIS-like AI Assistant with voice I/O and sub-agent orchestration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openhands-sdk>=0.1.0",
    "openhands-tools>=0.1.0",
    "openhands-workspace>=0.1.0",
    "gtts>=2.5.0",
    "speechrecognition>=3.10.0",
    "pydub>=0.25.1",
    "mutagen>=1.47.0",
    "httpx>=0.27.0",
    "gitpython>=3.1.40",
    "pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis"]
